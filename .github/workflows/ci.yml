name: Marg CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e '.[dev,mcp]'
      - name: Run tests
        run: pytest -q
      - name: Check code style
        run: ruff check src bench tests scripts
      - name: Check generated README
        run: python scripts/generate_readme.py --check
      - name: Smoke-test the read-only MCP server
        run: python scripts/check_mcp.py
