[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marg"
version = "0.1.0"
description = "A reproducible payment routing and fraud scoring simulation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8",
  "scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45", "fastapi>=0.110",
  "uvicorn>=0.27", "httpx>=0.27", "pydantic>=2.6"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.3"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
marg-mcp = "marg.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
